name: "🔌 MCP Server Issue"
description: "Report issues with MCP servers not working as expected"
title: "[MCP] "
labels: ["mcp", "quality-issue"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an MCP server issue! This helps us improve server functionality, tool availability, and configuration.

        **Before submitting:**
        - Search existing issues to avoid duplicates
        - Make sure you're using the latest plugin version
        - Confirm you restarted Claude Code after installing the MCP plugin
        - Check that dependencies (`gh`, `jq`) are installed and `gh` is authenticated

  - type: checkboxes
    id: preflight
    attributes:
      label: "Preflight Checklist"
      options:
        - label: "I have searched existing issues for duplicates"
          required: true
        - label: "I am using the latest plugin version"
          required: true
        - label: "I restarted Claude Code after installing/updating the plugin"
          required: true
        - label: "I have verified `gh` is installed and authenticated (`gh auth status`) and `jq` is installed"
          required: true

  - type: dropdown
    id: plugin
    attributes:
      label: "Which plugin?"
      description: "Select the plugin containing the MCP server"
      options:
        - github-mcp
        - Other
    validations:
      required: true

  - type: dropdown
    id: mcp-server
    attributes:
      label: "Which MCP server?"
      description: "Select the specific MCP server that had issues"
      options:
        - github-mcp / gh-tooling
        - github-mcp / gh-tooling-write
        - Other
    validations:
      required: true

  - type: dropdown
    id: tool-affected
    attributes:
      label: "Which MCP tool?"
      description: "Which tool (or tool group) from the MCP server had issues?"
      options:
        - gh-tooling / PR tools (pr_view, pr_diff, pr_list, pr_checks, pr_comments, pr_reviews, pr_files, pr_commits)
        - gh-tooling / issue tools (issue_view, issue_list)
        - gh-tooling / CI tools (run_view, run_list, run_logs, workflow_jobs, job_view, job_logs, job_annotations)
        - gh-tooling / commit tools (commit_pulls)
        - gh-tooling / search tools (search, search_code, search_repos, search_commits, search_discussions)
        - gh-tooling / repo browsing (repo_tree, repo_file)
        - gh-tooling / release_list
        - gh-tooling / label and project tools (label_list, project_list, project_view)
        - gh-tooling / api_read
        - gh-tooling-write / PR write tools (pr_create, pr_edit, pr_ready, pr_merge, pr_close, pr_reopen)
        - gh-tooling-write / review tools (pr_review_submit, pr_comment, pr_review_reply)
        - gh-tooling-write / issue write tools (issue_create, issue_edit, issue_close, issue_reopen, issue_comment)
        - gh-tooling-write / labels, assignees, sub-issues
        - gh-tooling-write / project writes (project_item_add, project_status_set)
        - gh-tooling-write / api
        - Server not loading (no tools available)
        - Other
    validations:
      required: true

  - type: textarea
    id: mcp-config
    attributes:
      label: "MCP Configuration"
      description: "Paste your `.mcp-gh-tooling.json` (redact anything sensitive). Leave blank if you run with no config file."
      placeholder: |
        {
          "repo": "owner/repo",
          "enable_write_server": true,
          "enforce_mcp_tools": true
        }
      render: json

  - type: dropdown
    id: issue-category
    attributes:
      label: "Issue Category"
      description: "What type of problem is this?"
      options:
        - Server not starting/loading
        - Tool not available in Claude Code
        - Tool execution failed
        - Tool returned incorrect results
        - Configuration not recognized
        - gh authentication failed
        - Connection timeout
        - Permission denied
        - Missing dependencies (gh / jq)
        - Config discovery failed
        - Hook blocked a tool it should not have (enforcement)
        - Performance issue (too slow)
        - Other
    validations:
      required: true

  - type: textarea
    id: tool-input
    attributes:
      label: "Tool Input/Parameters"
      description: "What parameters were passed to the MCP tool?"
      placeholder: |
        {
          "number": 339,
          "repo": "owner/repo"
        }
      render: json
    validations:
      required: true

  - type: textarea
    id: actual-output
    attributes:
      label: "Actual Output/Error"
      description: "What did the MCP tool return? Include error messages, unexpected results, etc."
      placeholder: |
        Show the tool's output including:
        - Error messages
        - Unexpected results
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: "Expected Behavior"
      description: "What should the MCP tool have done?"
      placeholder: |
        Describe the correct behavior you expected:
        - Should have returned the PR details
        - Should have listed the open issues
        - Should have returned the CI run logs
    validations:
      required: true

  - type: textarea
    id: why-problematic
    attributes:
      label: "Why This Is Problematic"
      description: "Explain specifically what's wrong with the behavior"
      placeholder: |
        - Tool returned an error but the equivalent `gh` command works manually
        - Results are incomplete or wrong
        - "repo is required" even though a default repo is configured
        - Wrong repository was queried
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: "Steps to Reproduce"
      description: "Provide step-by-step instructions to reproduce the issue"
      placeholder: |
        1. Install plugin with `/plugin install github-mcp@github-agent-tools`
        2. (Optional) Create `.mcp-gh-tooling.json` with a default `repo`
        3. Restart Claude Code
        4. Ask Claude to view a PR / list issues / fetch CI logs
        5. Observe [incorrect behavior]
    validations:
      required: true

  - type: textarea
    id: manual-test
    attributes:
      label: "Manual Command Test"
      description: "Does the underlying `gh` command work when run manually in the terminal?"
      placeholder: |
        # Manual command test (equivalent gh command)
        gh pr view 339 --repo owner/repo
        # Output: [paste results]

        # Did it work? Yes/No
      render: bash

  - type: textarea
    id: server-logs
    attributes:
      label: "Server Logs/Debug Output"
      description: "Paste any MCP server logs or debug output"
      placeholder: |
        Check MCP logs in Claude Code:
        - Developer Tools (if available)
        - stderr output from server
        - Any error messages
      render: shell

  - type: textarea
    id: config-discovery
    attributes:
      label: "Config Discovery Locations Checked"
      description: "If the config file was not picked up, which locations did you try?"
      placeholder: |
        - .mcp-gh-tooling.json (project root)
        - .claude/.mcp-gh-tooling.json
        - MCP_GH_TOOLING_CONFIG env var
        - etc.

  - type: dropdown
    id: reproducibility
    attributes:
      label: "Reproducibility"
      description: "How consistently does this issue occur?"
      options:
        - Always (100% of the time)
        - Usually (>75%)
        - Sometimes (25-75%)
        - Rarely (<25%)
        - Once
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: "Impact Level"
      description: "How severely does this affect your workflow?"
      options:
        - Critical (MCP server completely unusable)
        - High (major functionality broken)
        - Medium (workaround exists)
        - Low (minor inconvenience)
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: "Usage Frequency"
      description: "How often do you use this MCP tool?"
      options:
        - Daily
        - Weekly
        - Occasionally
        - First time using
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: "Plugin Version"
      description: "Run `/plugin list` and paste the version shown for this plugin"
      placeholder: "e.g., github-mcp@3.4.0"
    validations:
      required: true

  - type: input
    id: claude-version
    attributes:
      label: "Claude Code Version"
      description: "Run `claude --version` and paste the output"
      placeholder: "e.g., 0.1.23"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: "Operating System"
      options:
        - macOS
        - Linux (Ubuntu/Debian)
        - Linux (Fedora/RHEL)
        - Linux (Arch)
        - Linux (Other)
        - Windows (WSL2)
        - Other
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: "Dependency Versions"
      description: "Version information for relevant dependencies"
      placeholder: |
        gh --version          # gh version 2.x
        gh auth status        # logged in to github.com
        jq --version          # jq-1.7.1
        bash --version        # GNU bash 5.x
      render: bash
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: "Workaround"
      description: "Have you found any temporary workarounds?"
      placeholder: |
        Describe any manual steps you take to work around this issue:
        - Run the equivalent `gh` command directly in the terminal
        - Pass `repo` explicitly on every call
        - Disabled hook enforcement via `enforce_mcp_tools: false`

  - type: textarea
    id: additional-context
    attributes:
      label: "Additional Context"
      description: "Any other relevant information, related issues, or configuration details"
      placeholder: |
        - Link to related issues
        - Screenshots showing the problem
        - Full conversation transcript
        - Special repository or auth setup notes
